repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8

    hooks:
      - id: ruff
        args: ["--fix"] # Auto-fixes linting & formatting
        entry: ruff check src/pkg_name
        language: system
        pass_filenames: false
        types: [python]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: ["mypy~=1.15.0"]
        entry: mypy src/pkg_name
        language: python
        pass_filenames: false
        types: [python]
